    <text x="40" y="186" fill="#4d4d4d" font-family="Geist, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="450" letter-spacing="0">Precision brew calculator and timer</text>

    <g transform="translate(40 248)">
